<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="SAIL Level 5 · AH 대비 30일 영어 말하기 레슨">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3D57F5">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SAIL Lab">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>html{-webkit-text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>SAIL Speaking Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Gothic+A1:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: chat-lesson app. Phone column (max 680px); hero day card → swipeable phrase cards → interviewer/you chat bubbles.
   Signature: intonation printed above the words — sun-yellow dots over stressed words, small raised arrows for pitch, thin bars for pauses. */
:root{
  --bg:#F3F4FA; --surface:#FFFFFF; --surface-2:#F0F2FA; --ink:#14162E; --muted:#686C8A; --line:#E2E4F0; --line-2:#C9CCE0;
  --brand:#3D57F5; --brand-ink:#FFFFFF; --brand-soft:#E6EAFF; --brand-deep:#2A3FC7;
  --sun:#F2A900; --coral:#F0533F; --coral-soft:#FFE5E1; --mint:#0FA472; --mint-soft:#DBF5EA;
  --up:#E8590C; --down:#3D57F5;
  --shadow:0 1px 2px rgba(20,22,46,.05),0 8px 24px rgba(20,22,46,.07);
  --f-en:"Plus Jakarta Sans","Gothic A1",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ko:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0E1C; --surface:#161929; --surface-2:#1E2236; --ink:#F0F1FA; --muted:#9A9EBE; --line:#272B44; --line-2:#3A3F60;
    --brand:#6E86FF; --brand-ink:#0C0E1C; --brand-soft:#212A57; --brand-deep:#9AABFF;
    --sun:#FFD15C; --coral:#FF7564; --coral-soft:#3B1C1A; --mint:#3DD69C; --mint-soft:#123327;
    --up:#FF9A5C; --down:#8FA1FF;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0E1C; --surface:#161929; --surface-2:#1E2236; --ink:#F0F1FA; --muted:#9A9EBE; --line:#272B44; --line-2:#3A3F60;
  --brand:#6E86FF; --brand-ink:#0C0E1C; --brand-soft:#212A57; --brand-deep:#9AABFF;
  --sun:#FFD15C; --coral:#FF7564; --coral-soft:#3B1C1A; --mint:#3DD69C; --mint-soft:#123327;
  --up:#FF9A5C; --down:#8FA1FF;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ko);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto}
.en{font-family:var(--f-en)}
h1,h2,h3{margin:0;text-wrap:balance}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-en);font-weight:800;font-size:18px;letter-spacing:-.02em;white-space:nowrap}
.logo svg{width:28px;height:28px}
.top .sp{flex:1}
.stat{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-en);font-weight:700;font-size:13.5px;padding:6px 11px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);white-space:nowrap}
.stat svg{width:15px;height:15px}
.stat small{font-family:var(--f-ko);font-weight:600;font-size:11.5px;color:var(--muted)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.nav .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:14px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:700}
.nav a svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav a[aria-current="page"]{color:var(--brand)}
.nav a[aria-current="page"] svg{fill:var(--brand-soft)}

main{padding-block:6px 24px;display:flex;flex-direction:column;gap:18px}
.label{font-size:12.5px;font-weight:800;color:var(--muted);letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.label .count{font-family:var(--f-en);color:var(--brand)}
.card{background:var(--surface);border-radius:22px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.lead{margin:0;font-size:13.5px;color:var(--muted)}

/* hero */
.hero{background:var(--brand);color:#fff;border-radius:26px;padding:20px 20px 16px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:26px solid rgba(255,255,255,.08)}
.hero .row1{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.ring{width:66px;height:66px;flex:none;position:relative}
.ring svg{width:66px;height:66px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-en);font-weight:800;font-size:15px}
.hero h2{font-family:var(--f-en);font-weight:800;font-size:30px;letter-spacing:-.03em;line-height:1.05}
.hero .sub{font-size:13px;font-weight:600;opacity:.88}
.hero .tp{font-size:12.5px;font-weight:700;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:999px;align-self:flex-start}
.days{display:flex;gap:7px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 4px;position:relative;z-index:1;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-family:var(--f-en);font-weight:800;font-size:13.5px;scroll-snap-align:center}
.days button.done{background:#fff;color:var(--brand)}
.days button.today{box-shadow:inset 0 0 0 2.5px #fff}
.days button[aria-current="true"]{background:#14162E;color:#fff;box-shadow:inset 0 0 0 2.5px var(--sun)}

/* intonation markup */
.into{font-family:var(--f-en);line-height:2.15}
.into b{font-weight:800;color:var(--brand-deep)}
.st{position:relative}
.st::before{content:"";position:absolute;left:50%;top:-.42em;width:.34em;height:.34em;border-radius:50%;background:var(--sun);transform:translateX(-50%)}
.ar{position:relative;top:-.9em;font-size:.78em;font-weight:800;margin-left:.06em;line-height:0}
.ar.up{color:var(--up)}
.ar.dn{color:var(--down)}
.pz{display:inline-block;width:2px;height:.85em;border-radius:2px;background:var(--line-2);vertical-align:-.08em;margin:0 .12em}
.slot{font-family:var(--f-ko);font-size:.68em;font-weight:700;color:var(--up);background:var(--coral-soft);padding:1px 6px;border-radius:6px;white-space:nowrap;vertical-align:.12em}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--muted);background:var(--surface-2);padding:4px 10px;border-radius:999px}
.legend .dot{width:8px;height:8px;border-radius:50%;background:var(--sun)}
.legend .bar{width:2px;height:12px;background:var(--line-2);border-radius:2px}

/* phrase carousel */
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;margin:0 -2px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.pc{flex:0 0 86%;scroll-snap-align:start;background:var(--surface);border-radius:22px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.pc .num{font-family:var(--f-en);font-weight:800;font-size:12.5px;color:var(--brand);background:var(--brand-soft);align-self:flex-start;padding:3px 10px;border-radius:999px}
.pc .ph{font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.8}
.pc .kn{font-size:14px;font-weight:600;color:var(--muted);margin-top:-6px}
.pc .ex{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.pc .ex div{font-family:var(--f-en);font-size:15px;font-weight:500;line-height:1.5;display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline}
.pc .ex i{font-style:normal;font-family:var(--f-ko);font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px}
.pc .ex .w i{background:var(--brand-soft);color:var(--brand-deep)}
.pc .ex .d i{background:var(--mint-soft);color:var(--mint)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.dots i.on{background:var(--brand);width:20px;border-radius:99px}

/* chat lesson */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:100%}
.msg.eva .bub{background:var(--surface);border-radius:20px 20px 20px 6px;box-shadow:var(--shadow)}
.msg.me{justify-content:flex-end}
.msg.me .bub{background:var(--brand-soft);border-radius:20px 20px 6px 20px}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--f-en);font-weight:800;font-size:14px}
.av.e{background:var(--ink);color:var(--bg)}
.bub{padding:12px 15px;min-width:0;max-width:calc(100% - 44px)}
.msg.me .bub{max-width:100%}
.who{font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.qtxt{font-family:var(--f-en);font-size:18.5px;font-weight:700;line-height:1.4}
.ans{font-size:17.5px;font-weight:500;margin:0}
.ans.short{font-size:16.5px}
.tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tag.type{background:var(--brand);color:var(--brand-ink)}
.tr-verified{background:var(--mint-soft);color:var(--mint)}
.tr-mixed{background:var(--coral-soft);color:var(--up)}
.flow{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.flow span{font-size:12px;font-weight:700;background:var(--surface);border:1px solid var(--line);padding:3px 9px;border-radius:999px}
.flow em{font-style:normal;color:var(--line-2);font-weight:800}
.note{font-size:12.5px;color:var(--muted);background:var(--surface);border-radius:14px;padding:10px 12px;margin:0;border:1px dashed var(--line-2)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{border:0;border-radius:999px;padding:14px 16px;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.pill svg{width:18px;height:18px}
.pill.rec{background:var(--coral);color:#fff}
.pill.rec svg{fill:#fff}
.pill.done{background:var(--mint);color:#fff}
.pill.ghost{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.pill.brand{background:var(--brand);color:var(--brand-ink)}
.pill:disabled{opacity:.5}

/* connected speech · IPA */
.pi{display:block;font-family:"Segoe UI","SF Pro Text","Noto Sans","Lucida Sans Unicode","Arial Unicode MS",system-ui,sans-serif;font-size:14.5px;font-weight:500;color:var(--brand-deep);letter-spacing:.01em;line-height:1.5;margin-top:2px;overflow-wrap:anywhere}
.p5 .pi.hid{filter:blur(6px)}
.p5 details[open] .pi.hid{filter:none}
.li .pi{font-size:13.5px}
.keep{text-decoration:underline 2px var(--coral);text-underline-offset:3px;color:var(--coral);font-weight:700}
.el{opacity:.45}
.lk{color:var(--up);font-weight:800}
.ipz{color:var(--line-2)}
.ilg{display:flex;flex-wrap:wrap;gap:5px}
.ilg span{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--muted);background:var(--surface-2);padding:3px 9px;border-radius:999px}
.ilg b{font-family:"Segoe UI","SF Pro Text","Noto Sans",system-ui,sans-serif;color:var(--brand-deep);font-size:13px}
.ilg .keep{font-size:12px}
.sb{margin-top:10px;background:var(--surface);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:9px}
.sbh{font-size:12px;font-weight:800;color:var(--up)}
.sbi{display:flex;flex-direction:column;gap:1px;padding-top:8px;border-top:1px dashed var(--line)}
.sbh + .sbi{border-top:0;padding-top:0}
.st2{font-family:var(--f-en);font-size:15.5px;font-weight:700}
.sn{font-size:12.5px;color:var(--muted);line-height:1.5}

/* install banner */
.install{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:12px 12px 12px 14px;display:grid;grid-template-columns:1fr auto auto;gap:8px 8px;align-items:center;border:1.5px solid var(--brand-soft)}
.install .ib{display:flex;gap:10px;align-items:center;min-width:0}
.install .ib svg{width:34px;height:34px;flex:none;padding:6px;border-radius:10px;background:var(--brand-soft);stroke:var(--brand-deep);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.install .ib div{display:flex;flex-direction:column;min-width:0}
.install .ib b{font-size:14.5px;font-weight:800}
.install .ib span{font-size:12px;color:var(--muted);font-weight:600}
.install .pill{padding:10px 14px;font-size:13.5px;text-decoration:none;white-space:nowrap}
.install .x{border:0;background:transparent;font-size:22px;line-height:1;color:var(--muted);width:30px;height:30px;padding:0}
.ihelp{grid-column:1 / -1;background:var(--surface-2);border-radius:14px;padding:10px 12px;font-size:13.5px}
.ihelp ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.ihelp .sm{margin:6px 0 0;font-size:12px;color:var(--muted)}
@media (max-width:420px){.install .ib span{display:none}}

/* today's 5 phrases — one glance */
.t5{gap:10px}
.t5head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.t5head .sp{flex:1}
.tog{border:1.5px solid var(--line-2);background:transparent;border-radius:999px;padding:5px 11px;font-weight:800;font-size:12px;color:var(--muted)}
.tog[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.p5{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.p5 li{border-top:1px solid var(--line)}
.p5 li:first-child{border-top:0}
.p5 summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:10px 0}
.p5 summary::-webkit-details-marker{display:none}
.p5 .n{width:26px;height:26px;border-radius:50%;background:var(--brand-soft);color:var(--brand-deep);font-family:var(--f-en);font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center}
.p5 .pb{display:flex;flex-direction:column;min-width:0}
.p5 .pe{font-size:17px;font-weight:800;line-height:1.85}
.p5 .pe.hid{filter:blur(7px);user-select:none}
.p5 details[open] .pe.hid{filter:none}
.p5 .pk{font-size:13.5px;font-weight:600;color:var(--muted);line-height:1.4;margin-top:-2px}
.p5 .more{display:flex;flex-direction:column;gap:9px;padding:0 0 12px 36px}
.nu{margin:0;font-size:13.5px;line-height:1.6;background:var(--surface-2);border-radius:12px;padding:9px 11px}
.nu b{font-weight:800;color:var(--up);margin-right:6px}
.p5 .ex{display:flex;flex-direction:column;gap:6px}
.p5 .ex div{font-family:var(--f-en);font-size:14.5px;font-weight:500;line-height:1.5;display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline}
.p5 .ex i{font-style:normal;font-family:var(--f-ko);font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px}
.p5 .ex .w i{background:var(--brand-soft);color:var(--brand-deep)}
.p5 .ex .d i{background:var(--mint-soft);color:var(--mint)}
.tone{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap;align-self:start;margin-top:6px}
.t-cas{background:var(--mint-soft);color:var(--mint)}
.t-mid{background:var(--surface-2);color:var(--muted)}
.t-pol{background:var(--brand-soft);color:var(--brand-deep)}
.t-for{background:var(--ink);color:var(--bg)}
.known.sm{grid-row:auto;width:auto;height:auto;padding:6px 12px;font-size:12px;font-weight:800;color:var(--muted);align-self:flex-start}
.known.sm[aria-pressed="true"]{color:#fff}
.kod{margin-top:8px;border-top:1px dashed var(--line-2);padding-top:6px}
.kod summary{cursor:pointer;font-size:12.5px;font-weight:800;color:var(--brand-deep);list-style:none}
.kod summary::-webkit-details-marker{display:none}
.kod summary::before{content:"+ "}
.kod[open] summary::before{content:"− "}
.kod p{margin:6px 0 0;font-size:14.5px;line-height:1.75;color:var(--ink)}

/* phrases library */
.filters{display:flex;gap:6px}
.chip{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.progress{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--mint);border-radius:99px}
.lib{display:flex;flex-direction:column;gap:8px}
.lib h3{font-size:12.5px;font-weight:800;color:var(--muted);margin:10px 0 0}
.li{background:var(--surface);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;box-shadow:var(--shadow)}
.li .p{font-size:16.5px;font-weight:700;line-height:1.9}
.li .k{grid-column:1;font-size:13px;color:var(--muted)}
.li .k em{font-style:normal;font-family:var(--f-en);color:var(--ink)}
.known{grid-row:span 2;border:2px solid var(--line-2);background:transparent;border-radius:999px;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.known svg{width:18px;height:18px;stroke:var(--line-2);fill:none;stroke-width:3}
.known[aria-pressed="true"]{background:var(--mint);border-color:var(--mint)}
.known[aria-pressed="true"] svg{stroke:#fff}

/* recorder */
.recwrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0}
.meter{display:flex;gap:4px;align-items:center;height:56px}
.meter i{width:5px;border-radius:5px;background:var(--line-2);height:8px;transition:height .08s}
.meter.on i{background:var(--coral)}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--coral);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 10px var(--coral-soft)}
.mic svg{width:36px;height:36px;fill:#fff}
.mic.on{animation:rp 1.4s ease-in-out infinite}
@keyframes rp{50%{box-shadow:0 0 0 18px var(--coral-soft)}}
.clock{font-family:var(--f-en);font-size:38px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.clock.z-good{color:var(--mint)}
.clock.z-over{color:var(--up)}
.target{font-size:12.5px;font-weight:700;color:var(--muted)}
select{width:100%;font:inherit;font-weight:700;font-size:14.5px;color:var(--ink);background:var(--surface);border:0;box-shadow:var(--shadow);border-radius:14px;padding:12px 14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:11px;padding:9px;font-weight:800;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.take{background:var(--surface-2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.take .tt{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:700;color:var(--muted)}
.take .tt b{font-family:var(--f-en);color:var(--ink);overflow-wrap:anywhere}
audio{width:100%}
.btn{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:12px;padding:9px 13px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn.brand{background:var(--brand);color:var(--brand-ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.alt{background:var(--coral-soft);border-radius:18px;padding:14px 16px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.alt ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.alt code{font-family:var(--f-en);font-size:12.5px;font-weight:700;background:var(--surface);padding:1px 6px;border-radius:6px;overflow-wrap:anywhere}

/* SAIL tab */
.mylevel{background:var(--ink);color:var(--bg);border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:12px}
.mylevel h2{font-family:var(--f-en);font-weight:800;font-size:26px;letter-spacing:-.02em}
.mylevel p{margin:0;font-size:14px;opacity:.85}
.lvl{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lv{border-radius:14px;padding:9px 4px;text-align:center;display:flex;flex-direction:column;gap:1px;background:rgba(127,127,160,.16);min-width:0}
.lv b{font-family:var(--f-en);font-size:20px;font-weight:800}
.lv span{font-family:var(--f-en);font-size:11px;font-weight:700;opacity:.85}
.lv.pick{background:var(--sun);color:#14162E}
.facts{display:flex;flex-direction:column}
.fa{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.fa:last-child{border-bottom:0}
.fa b{font-size:12.5px;font-weight:800;color:var(--muted)}
.crit{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cr{background:var(--surface-2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cr b{font-family:var(--f-en);font-size:14.5px;font-weight:800}
.cr span{font-size:13px;color:var(--muted)}
.tips{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.tips b{color:var(--brand-deep)}
.types{display:flex;flex-direction:column;gap:10px}
.ty{background:var(--surface-2);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.ty h3{font-size:14.5px;font-weight:800}
.ty .ex{font-family:var(--f-en);font-size:14.5px;font-weight:600;color:var(--brand-deep)}
.ty .how{font-size:13px;color:var(--muted)}
.ty .dd{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.ty .dd button{border:0;background:var(--surface);border-radius:8px;font-family:var(--f-en);font-weight:800;font-size:11.5px;padding:3px 8px}
.plan .pl{display:grid;grid-template-columns:86px 1fr;gap:10px;font-size:14px;padding:9px 0;border-bottom:1px dashed var(--line)}
.plan .pl:last-child{border-bottom:0}
.plan .pl b{font-family:var(--f-en);font-weight:800;color:var(--brand)}
.sources{font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.sources a{color:var(--brand);font-weight:700;overflow-wrap:anywhere}
input[type=date]{font:inherit;font-weight:700;font-size:14.5px;padding:10px 12px;border:0;box-shadow:var(--shadow);border-radius:12px;background:var(--surface);color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:700;padding:10px 16px;border-radius:14px;z-index:20;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (max-width:420px){
  .hero h2{font-size:27px}
  .qtxt{font-size:17.5px}
  .ans{font-size:16.5px}
  .pc .ph{font-size:20px}
  .crit{grid-template-columns:1fr}
  .lv b{font-size:17px}
  .lv span{font-size:9.5px}
  .stat{padding:5px 9px;font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

["^Looking back, ~","돌아보면","'지금 돌이켜 보면' 느낌. 경험 답변에서 교훈 직전에.","중립","Looking back, I should have asked earlier.","Looking back, it was a great decision."],
["The ^biggest takeaway was ~","가장 큰 교훈은","'거기서 얻은 제일 큰 건' 느낌. lesson보다 업무적이고 세련돼요.","중립","The biggest takeaway was to check assumptions early.","The biggest takeaway was to pack light."],

{type:"자기소개",truth:"verified",q:"Let's start the interview. Tell me a little bit about yourself.",

 a:`Sure, | ^happy to.↘ I'm a ^structural engineer | with about ^eleven years in ship and offshore structures.↘ These days, | I ^lead structural design on international projects,↗ | so a ^big part of my job | is **getting everyone on the same page**,↘ | owners, | ^class societies, | ^contractors, | you name it.↘ ^Honestly, | **what I enjoy most** | is taking something ^really technical | and explaining it in ^plain English.↘ **Lately, I've been really into** ^AI.↘ I'm running a ^digital twin project,↗ | and I've been building little ^apps | to automate the boring parts of my job.↘ Outside of work, | I'm a ^scuba diver,↗ | a Rescue Diver, | ^actually,↘ | so **whenever I get the chance**, | I try to get in the ^water.↘ And I'm studying for a professional engineering ^exam, | so my evenings are ^pretty full.↘ But I ^like it that way.↘`,

{type:"과거 경험 · 취미",truth:"verified",q:"Tell me about a hobby you really enjoy. Why do you like it?",
 st:["취미 한 줄","얼마나 진심인지","기억나는 여행","좋은 이유","일과 연결"],
 a:`Oh, | **that's an easy one for me.**↘ It's ^scuba diving.↘ I actually went all the way to ^Rescue Diver,↗ | so **it's more than just a vacation thing** for me.↘ **One trip that really stands out** is ^Coron, | in the Philippines.↘ We did ^three dives a day,↗ | which was **exhausting, but in a good way**.↘ What I ^love about diving | is that it's a ^completely different world down there.↘ You can't check your ^phone,↗ | you can't think about ^work.↘ It's just ^you, | your ^breathing, | and your ^buddy.↘ It's pretty much the ^only time I fully **switch off**.↘ And the rescue training ^stuck with me, | too.↘ It taught me to stay ^calm under pressure,↗ | which, | **funny enough**, | comes in ^handy at work as well.↘`,

{type:"의견 · 사회",truth:"verified",q:"Some people say AI will replace a lot of jobs. What do you think?",

{type:"과거 경험 · 갈등",truth:"verified",q:"Tell me about a time you disagreed with someone at work. How did you handle it?",

{type:"습관 · 스트레스",truth:"mixed",q:"What do you usually do when you're stressed out?",
 st:["종류에 따라","업무 스트레스","번아웃","평소","한 줄"],
 a:`Hmm, | **it really depends on what kind of stress it is.**↘ If it's ^work stress, | like a tight ^deadline,↗ | **the worst thing I can do** | is just ^stare at the whole thing.↘ So I **break it down** into smaller ^tasks | and **knock out** the ^easy ones first.↘ **That alone takes a lot of the pressure off.**↘ But when it's more of a ^burnout kind of stress,↗ | I need to ^physically get away from it.↘ And for me, | the best ^reset is ^diving.↘ **Once I'm underwater**, | there's ^literally no way to check emails.↘ ^Obviously, | I can't go diving every ^weekend,↗ | so in a normal week, | I just try to get some ^fresh air [실제로].↘ It ^sounds simple,↗ | but it ^works.↘`,
 fq:"Why do you think stress levels are so high among office workers these days?",
 fa:`**I think it's a mix of things.**↘ Long ^hours, | ^competition, | and always being ^online.↘ **The good news is**, | people are talking about it a lot ^more now.↘`,
 note:"다이빙은 실제. 평소 대처법은 실제 습관으로 교체."},
{type:"롤플레이 · 질문하기",truth:"hypothetical",q:"Role-play: A colleague has started using a new AI tool. Ask them three or four questions about it.",
 st:["양해 구하기","질문 ① 기간","② 용도","③ 정확도","④ 배울 가치","이유·마무리"],
 a:`Hey, | **do you have a minute?**↗ I heard you started using that new ^AI tool for reports,↗ | and **I've been meaning to ask you about it.**↘ ^First, | how long have you been ^using it?↘ And what do you ^mostly use it for?↘ Is it just for ^drafting,↗ | or does it help with checking ^numbers, | too?↗ **I'm also curious about** ^accuracy.↘ Have you ever caught it making ^mistakes, | like getting a technical term ^wrong?↗ And **one last thing**:↗ | is it ^worth the time it takes to learn?↗ I'm thinking about trying it for our ^meeting minutes,↗ | so **any tips would be great.**↘ No ^rush, | though.↘`,
 fq:"Honestly, I use it for almost everything now. Do you think the whole team should use it?",
 fa:`**Maybe not all at once.**↘ I'd start with a ^small pilot, | ^see what works, | and ^then roll it out.↘ That way, | we're not ^forcing it on anyone.↘`,
 note:"질문 형태를 다양하게: How long / What / Have you ever / Is it worth. 'No rush, though.'로 매너 있게 마무리."},
{type:"과거 경험 · 발표",truth:"mixed",q:"Tell me about a time you had to speak in front of a group. How did it go?",
 st:["언제·어디","역할","진짜 어려움","내 방법","Q&A 대처"],
 a:`**A good example is** a workshop I did in ^Oslo,↗ | with people from several different ^organizations.↘ My role was to **walk them through** the hull structure side of things | and handle the ^Q&A.↘ Now, | **the challenge wasn't the content itself.**↘ I know the material ^well.↘ It was that everyone in the room had a ^different background | and ^different priorities.↘ Some people were ^deep into the technical details,↗ | and others just wanted **the big picture**.↘ So I tried to break things down | into a ^simple storyline:↗ | what the ^problem is, | what our ^options are, | and what we ^recommend.↘ And during the Q&A, | when I got a ^tough question,↗ | I'd say something like, | "**That's a great point. | Let me make sure I understand the question,**"↘ | which bought me a ^second to think.↘`,
 fq:"In your opinion, what makes a presentation really effective?",
 fa:`**Honestly, | knowing your audience.**↘ The same ^content can land completely ^differently | depending on ^who's in the room.↘ So I always ask myself, | what do ^they need to walk away with?↘`,
 note:"오슬로 워크숍·Q&A 역할은 실제(E02). 청중 반응은 미확인 — 추가하지 말 것."},
{type:"과거 경험 · 문제 발견",truth:"verified",q:"Tell me about a time you noticed a problem that others might have missed.",
 st:["상황","겉보기엔 OK","내가 던진 질문","목적","품질에 대한 생각"],
 a:`**One example is** when a partner company sent us a ^weld evaluation.↘ They'd used a ^2D shell model,↗ | and **on paper**, | the numbers looked ^fine.↘ But I've learned **not to stop at the final numbers.**↘ If I can't explain ^how a result was produced,↗ | I can't really ^defend it | in front of the client or the class society.↘ So I asked them a few ^basic questions, | ^politely.↘ What ^element type did you use?↘ What were the ^boundary conditions and load cases?↘ And ^where exactly did you read the stress?↘ I also asked if they could share the ^model itself.↘ **It wasn't about assuming they were wrong.**↘ It was about making the analysis ^traceable.↘ For me, | quality isn't just a ^passing number.↘ It's being able to **stand behind** ^how you got there.↘`,
 fq:"Do you think people rely too much on numbers and data these days?",
 fa:`**Sometimes, | yes.**↘ Numbers ^look objective,↗ | but they're only as good as the ^assumptions behind them.↘ So I'd say | trust the data,↗ | but ^always ask where it came from.↘`,
 note:"질문 항목은 실제(E04). 상대 방법이 틀렸다는 결론은 미확인."},
{type:"의견 · 배움",truth:"verified",q:"Is it better to learn new skills on your own or through formal training?",
 st:["조건부 결론","이유","내 예시","단점 인정","이상적 방법"],
 a:`**I think it depends on the stage you're at**,↗ | but these days, | **I lean toward** learning on my ^own,↗ | with some ^structure.↘ **Here's my thinking.**↘ Formal training is ^great for the fundamentals,↗ | because it gives you a ^framework.↘ But **once you have the basics**,↗ | the fastest way to learn | is to **build something real**.↘ **Take AI tools, for example.**↘ No course can keep up with how ^fast they're changing.↘ So I've been learning by ^doing, | building small apps to automate parts of my ^work.↘ There's a ^steep learning curve,↗ | and I get ^stuck a lot,↗ | but every time I get ^unstuck, | it really ^sticks.↘ **The one downside is** | that you can pick up ^bad habits without feedback.↘ So ideally, | I'd do ^both.↘`,
 fq:"Should schools focus more on practical skills than academic knowledge?",
 fa:`**I'd say they need both, | but the balance is a bit off.**↘ Students learn a ^lot of theory,↗ | but not enough about ^applying it.↘ ^More hands-on projects | would make a ^huge difference.↘`,
 note:"AI 도구로 앱을 만들며 배우는 중인 것은 실제(E07)."},
{type:"비교 · 과거와 현재",truth:"mixed",q:"How has the way people work changed compared to ten years ago?",
 st:["가장 큰 변화","예전 (과거시제)","요즘","장점 / 단점","다음 변화"],
 a:`**The biggest change, | I'd say,** | is that ^distance doesn't matter as much ^anymore.↘ Ten years ^ago, | if we had a design issue with an overseas client,↗ | it ^usually meant a long email chain | or a ^business trip.↘ **These days**, | we just **jump on a video call**, | share the model on ^screen,↗ | and **sort it out** in an ^hour.↘ **On the plus side**, | decisions happen ^much faster.↘ **On the flip side**, | the workday never ^really ends,↗ | because ^someone's always online in a different time zone.↘ And now with ^AI, | I think the next big change | is how much ^routine work just disappears.↘ **The challenge** will be making sure people still understand | what's going on ^under the hood.↘`,
 fq:"Do you think these changes have made people happier at work?",
 fa:`**That's a tough one.**↘ More ^flexible, | ^definitely.↘ ^Happier? | I'm not so ^sure.↘ It really depends on whether people can set ^boundaries.↘`,
 note:"과거↔현재 시제 대비가 이 유형의 채점 포인트."},
{type:"의견 · 환경",truth:"mixed",q:"What do you think about stricter environmental regulations in the shipping industry?",
 st:["입장","이유","장점 (혁신)","단서 (현실)","조건부 정리"],
 a:`**Honestly, | I think they're necessary**, | even though they're ^tough on the industry.↘ Shipping moves ^most of the world's goods,↗ | so the emissions really ^add up.↘ **Without regulations**, | there's not much ^incentive to change,↗ | because cleaner technology costs more ^upfront.↘ **On the plus side**, | the rules are pushing real ^innovation.↘ Ships that run on ^LNG are becoming pretty common,↗ | and people are working on ^ammonia and ^methanol, | too.↘ **That said**, | the timelines can be really ^aggressive.↘ Shipowners have to make ^huge investment decisions | without knowing which fuel will ^win in the long run.↘ So I'd say | the ^direction is right,↗ | but the rules need to be ^clear and ^predictable,↗ | so the industry can actually ^plan for them.↘`,
 fq:"Who should pay for going green: companies, governments, or consumers?",
 fa:`**Realistically, | all three.**↘ ^Governments can help with ^incentives,↗ | companies have to ^invest,↗ | and ^consumers will probably see slightly higher prices.↘ **It's not black and white.**↘`,
 note:"업계 일반론으로만 답하기(회사 정보 X). SAIL은 사회·환경 의견 비중이 높다는 후기."},
{type:"과거 경험 · 도전",truth:"mixed",q:"Tell me about a skill that was difficult for you to learn.",
 st:["기술","전과 후","무엇을 했나","진짜 어려움","교훈"],
 a:`**One skill that really pushed me** was ^rescue diver training.↘ Before that, | diving was mostly about enjoying the ^view.↘ But rescue training is **a whole different story**.↘ You practice things like bringing an ^unresponsive diver to the surface,↗ | or dealing with a ^panicked diver,↗ | and you have to think ^clearly | while your heart is ^racing.↘ **What made it hard** wasn't just the ^physical part.↘ It was learning to slow ^down | when every instinct tells you to ^rush.↘ **The biggest takeaway** for me | was that staying calm is a ^skill,↗ | not a ^personality trait.↘ You can actually ^train it.↘ And honestly, | **that's come in handy** in tense ^meetings, | too.↘`,
 fq:"Do difficult experiences make people stronger, or can they hold people back?",
 fa:`**I think it depends on the support you have.**↘ With the right ^people around you,↗ | tough experiences make you ^stronger.↘ Without it, | they can ^definitely hold you back.↘`,
 note:"Rescue Diver 자격은 실제. 훈련 장면은 PADI 표준 과정 — 본인이 기억하는 장면으로 바꾸면 더 강함."},
{type:"과거 경험 · 프로젝트",truth:"verified",q:"Tell me about a project you're excited about right now.",
 st:["프로젝트","쉬운 설명","목표","정직한 현황","왜 설레나"],
 a:`Oh, | **the one I'm most excited about** | is a structural ^digital twin | for an offshore floating unit,↗ | where I'm the project ^manager.↘ **The basic idea is pretty simple.**↘ Right now, | inspections are mostly done on a ^fixed schedule,↗ | whether the structure ^needs it or not.↘ We're trying to **connect the dots** between ^motion data, | ^structural stress, | ^fatigue, | and ^inspection planning.↘ **In other words**, | we want to turn operating data into ^decisions,↗ | ^where to inspect, | and ^when.↘ It's ^still in development,↗ | so **I don't want to oversell it**.↘ But **what really excites me** | is that it could move us from ^reactive | to ^proactive.↘`,
 fq:"What could go wrong when companies rely too much on systems like that?",
 fa:`**The biggest risk is blind trust.**↘ If the ^input data is bad,↗ | the decisions will be ^bad too.↘ **That's why** you still need ^engineers checking the results.↘`,
 note:"DT PM 역할은 실제(E05). 승인·비용 절감 '달성'은 말하지 않기."},
{type:"묘사 · 동네",truth:"hypothetical",q:"Describe the area where you live. What do you like or dislike about it?",
 st:["한 줄 그림","분위기","좋은 점","단점","가정"],
 a:`I live in a fairly ^quiet residential area [실제 동네로].↘ **It's the kind of place where** | you see the ^same faces at the coffee shop every morning.↘ **What I like most about it** | is that ^everything I need is **within walking distance**,↗ | a grocery store, | a few good ^restaurants, | and a small ^park [실제로].↘ It's **not the most exciting neighborhood**,↗ | but after a ^long day, | that's ^exactly what I want.↘ The ^only downside is the ^traffic during rush hour.↘ It can take ^forever just to get out of the area.↘ **If I could change one thing**, | I'd add more ^walking trails,↗ | because I've been trying to get more ^exercise lately.↘`,
 fq:"What do you think makes a neighborhood a good place to raise a family?",
 fa:`**I'd say safety first, | then community.**↘ Good ^schools matter, | of course.↘ But knowing your ^neighbors | makes a ^huge difference.↘`,
 note:"동네 정보가 없어 틀만 제공. [ ] 부분을 실제로 채워서 외우세요."},
{type:"돌발 · 기술",truth:"mixed",q:"What kind of technology do you use every day, and how has it changed your life?",
 st:["대표 기술","업무 활용","생활 활용","바뀐 생각","단점","정리"],
 a:`**The obvious answer is** my ^smartphone,↗ | but honestly, | the ^bigger change for me has been ^AI tools.↘ I use them pretty much ^every day now.↘ At work, | I use them to ^summarize long documents | and ^draft emails,↗ | and I've even built a couple of small ^apps with AI's help.↘ **It's saved me a ton of time.**↘ On my commute, | I use my phone to ^study.↘ I used to think I needed ^long blocks of time,↗ | but **it turns out** | small pockets of time really ^add up.↘ **The downside is** | it's hard to ^switch off.↘ If I'm not ^careful, | I end up checking work stuff late at ^night.↘ So I'd say | technology's made me more ^productive,↗ | but I have to set my ^own limits.↘`,
 fq:"Should there be stricter rules on how much time children spend on smartphones?",
 fa:`**I'd lean toward yes, | at least for younger kids.**↘ But ^rules alone won't work.↘ Parents have to set a good ^example, | too,↗ | **which is easier said than done**.↘`,
 note:"AI 도구·출퇴근 학습은 실제(E07·E10)."},
{type:"롤플레이 · 업무 문제",truth:"hypothetical",q:"Role-play: A supplier just told you their delivery will be two weeks late. Call them, find out why, and propose some solutions.",
 st:["감사","영향 설명","원인 질문","대안 ①②","기한 요청"],
 a:`Hi, | **thanks for letting us know** about the delay.↘ **I really appreciate the heads-up.**↘ **I'll be honest with you**, | though.↘ Two weeks is a ^big problem for our schedule,↗ | so I'd like to understand what's going ^on.↘ **Could you walk me through** what caused it?↗ Is it a ^material issue,↗ | or a ^production issue?↘ **The reason I ask** is that it changes what we can ^do.↘ What would it ^take to bring it forward?↘ For example, | could you split the delivery | and send the most ^critical parts first?↗ Or **alternatively**, | could you add an extra ^shift to catch up?↗ **We're on the same team here**,↗ | so **I'd really appreciate it if** | you could send me a recovery plan by ^tomorrow.↘`,
 fq:"We can only send half on time. Would that work for you?",
 fa:`**That would definitely help, | thank you.**↘ Let's just make sure the ^critical items are in that first half.↘ Could you send me the ^list today?↗`,
 note:"상황은 가상, 말투는 실제 협력사 협의(E03)에서 가져옴. 감사 → 단호 → 협력의 순서가 매너."},
{type:"과거 경험 · 결정",truth:"mixed",q:"Tell me about a difficult decision you had to make at work.",
 st:["상황","겉보기 정답","현실 문제","설득","결과","교훈"],
 a:`**One that comes to mind** | is choosing between two structural design ^options on an offshore project [실제 사례로].↘ **On paper**, | option A looked ^better.↘ It was ^lighter,↗ | and the analysis results were ^clean.↘ **But the thing is**, | it would've been ^really hard to fabricate,↗ | and inspectors would've had trouble getting ^in there later.↘ Option B was a bit ^heavier,↗ | but much more ^practical in the real world.↘ It ^wasn't an easy call,↗ | because some people were only looking at the ^numbers.↘ So I **walked them through the trade-offs**:↗ | weight versus ^fabrication, | ^inspection, | and ^maintenance.↘ **In the end**, | we went with the ^practical option [실제 결과로].↘ **Looking back**, | it taught me that the best ^technical answer | isn't always the best answer for the ^project.↘`,
 fq:"If you could go back, would you do anything differently?",
 fa:`Maybe I'd bring in the ^fabrication team earlier.↘ If they'd been in the room from ^day one,↗ | we could've ^saved a few rounds of discussion.↘`,
 note:"제작성·검사 접근성을 함께 보는 판단은 실제(E11). 구체 사례·결과는 실제 것으로."},
{type:"가정",truth:"hypothetical",q:"If you were the CEO of your company for a day, what would you focus on first?",
 st:["If I were ~, I'd ~","이유","구체 실행","현실 인정","기대 효과"],
 a:`Oh, | **that's a fun one.**↘ **If I were the CEO for a day**, | I'd focus on how our engineers ^spend their time.↘ **Here's why.**↘ A lot of really ^skilled people | spend hours on ^repetitive work,↗ | like updating ^reports | and tracking status ^by hand.↘ **If it were up to me**, | I'd set up a small team to ^automate that,↗ | and I'd let the ^engineers suggest what to automate,↗ | because ^they know where the pain points are.↘ I'd also make sure people get ^real time to learn these tools,↗ | not just a ^one-day training.↘ Of course, | one day isn't enough to change ^much.↘ But if I could get the ball ^rolling,↗ | I think it would ^really pay off in the long run.↘`,
 fq:"What do you think is the most important quality for a CEO?",
 fa:`**I'd say the ability to listen.**↘ CEOs are ^far from the actual work,↗ | so they need people who'll tell them the ^truth,↗ | and they have to ^want to hear it.↘`,
 note:"가정법(If I were… I'd…)을 끝까지 유지하는 것이 상위 등급 신호."},
{type:"의견 · 장단점",truth:"mixed",q:"What are the pros and cons of working from home?",
 st:["한 줄 평가","장점 ①②","단점","내 분야 예시","절충안"],
 a:`**I'd say it's a double-edged sword.**↘ **On the plus side**, | you save a ^lot of time on commuting,↗ | and it's easier to ^focus when you're doing deep work, | like checking analysis results.↘ **On top of that**, | video calls are so ^normal now | that distance doesn't really ^matter as much.↘ **On the flip side**, | you lose the ^small conversations.↘ In my field, | a lot of problems get solved | when you just walk over to someone's ^desk | and look at a drawing ^together.↘ **That's easier said than done** over a screen.↘ So personally, | I think a ^hybrid model makes the most sense.↘ Work from home when you need to ^focus,↗ | and come in when you need to ^collaborate.↘`,
 fq:"Do you think remote work will become the norm in the future?",
 fa:`**For some jobs, | definitely.**↘ But for work like ^mine, | where you're dealing with ^physical things,↗ | I think the office is here to ^stay.↘`,
 note:"의견 답변. 실제 근무 형태에 맞게 선호를 조정."},
{type:"과거 경험 · 유머",truth:"hypothetical",q:"Tell me about a funny or memorable conversation you had recently.",
 st:["예고","상황","반전","내 한마디","느낀 점"],
 a:`**This is a small thing, | but it made me laugh.**↘ A friend of mine was ^complaining | that I check my phone ^too much at dinner [실제 일화로].↘ And, | **fair enough**.↘ But ^literally five minutes later,↗ | ^they were scrolling through ^their phone.↘ So I said, | "Oh, | **come on**, | **you've got a bit of a double standard going on there**."↘ And we both just ^cracked up.↘ **What I like about moments like that** | is that you can ^call someone out | without it turning into an ^argument.↘ **A little humor goes a long way.**↘`,

{type:"의견 · 커리어",truth:"mixed",q:"Some people stay at one company for a long time, while others change jobs often. What's your view?",
 st:["정답 없음","한 회사의 장점","이직의 장점","위험","내 기준"],
 a:`**I don't think there's one right answer.**↘ **It really comes down to** | what you want to ^build.↘ ^Staying at one company | lets you go ^deep.↘ You understand how things ^really work,↗ | people ^trust you,↗ | and you get to take on ^bigger responsibilities.↘ **On the other hand**, | changing jobs exposes you to ^different ways of doing things,↗ | and it can ^speed up your growth, | especially early in your ^career.↘ **The risk is** | that you never stay long enough | to see the ^results of your own decisions.↘ So I'd say | it's not about how ^long you stay.↘ It's about whether you're still ^learning.↘`,
 fq:"How do younger generations view job security compared to older ones?",
 fa:`**I think they see it very differently.**↘ For my ^parents' generation, | one company for ^life was the goal.↘ Younger people care more about ^growth | and ^flexibility.↘ **And honestly, | I get it.**↘`,
 note:"의견 답변. 본인 생각에 맞게 조정."},
{type:"의견 · AI와 책임",truth:"verified",q:"Should AI be used to make important decisions? Why or why not?",
 st:["입장","핵심 이유","인정 (AI 강점)","내 프로젝트 예시","정리"],
 a:`**I think AI should support important decisions**,↗ | but not ^make them on its own.↘ **The main reason is** ^accountability.↘ In engineering, | when a design gets ^approved, | a ^person has to stand behind it.↘ If something goes ^wrong,↗ | "the AI said so" | just isn't an acceptable ^answer.↘ **That said**, | AI is ^incredibly good at handling huge amounts of data,↗ | and it can spot ^patterns that people miss.↘ For example, | in my digital twin project, | the goal is to use data to decide ^where and ^when to inspect a structure.↘ But the ^final call | still needs to come from an engineer | who understands the ^context.↘ So **I'd put it this way**:↗ | let AI do the ^heavy lifting,↗ | but keep a ^human in the loop.↘`,
 fq:"If an AI system makes a serious mistake, who should be responsible?",
 fa:`**That's the million-dollar question.**↘ I'd say the ^company that deploys it,↗ | not the ^user.↘ If you put it into ^service, | you ^own the outcome.↘`,
 note:"DT 목표는 실제(E05)."},
{type:"미래 · 목표",truth:"mixed",q:"Where do you see yourself in five years?",
 st:["되고 싶은 모습","지금 하는 일","키우고 싶은 것","개인 목표","마무리"],
 a:`**In five years**, | I'd ^love to be the person | who connects traditional structural engineering | with ^digital technology.↘ Right now, | I'm working on a ^digital twin project,↗ | and I can ^already see how much value there is | in using ^real operating data.↘ **I'd like to take that further** | and help turn it into a ^real service, | not just a ^pilot [목표는 본인 생각으로].↘ On a ^personal level, | I want to pass my professional engineering ^exam,↗ | and I'd love to get comfortable enough in ^English | to lead international meetings | without thinking ^twice.↘ **If I can pull that off**, | I think I'll be in a ^really good place.↘ And hopefully, | I'll still have time for a few ^diving trips.↘`,
 fq:"What advice would you give someone just starting a career in engineering?",
 fa:`**Ask a lot of questions, | even the basic ones.**↘ Nobody expects you to know ^everything.↘ But they ^do expect you to understand ^why you're doing something.↘`,

/* 모범 답안 / 팔로업 답의 한국어 어감 (의역). [본 답안, 팔로업 답] — Day 순서 */
const KO=[
["네, 그럼요. 저는 선박·해양 구조 분야에서 11년쯤 일한 구조 엔지니어예요. 요즘은 국제 프로젝트의 구조 설계를 이끌고 있어서, 선주든 선급이든 시공사든 다 같은 생각을 하게 맞추는 게 제 일의 큰 부분이에요. 솔직히 제일 즐거운 건 정말 기술적인 내용을 쉬운 말로 풀어주는 거예요. 요즘은 AI에 푹 빠져 있어요. 디지털 트윈 프로젝트를 맡고 있고, 일 중에 지루한 부분을 자동화하는 작은 앱들도 만들고 있어요. 일 밖에서는 스쿠버 다이버예요. 사실 레스큐 다이버 자격도 있어서 기회만 되면 물에 들어가요. 그리고 기술사 시험 공부도 하고 있어서 저녁이 꽤 꽉 차 있어요. 그래도 그렇게 사는 게 좋아요.","아, 그럼요. 실제 데이터로 계속 업데이트되는 구조물의 '가상 쌍둥이'라고 생각하시면 돼요. 그래서 언제 닳을지 짐작하는 대신, 미리 눈으로 보이는 거죠."],
["솔직히 평일은 꽤 빡빡해요. 하루 대부분이 설계 검토랑 해외 고객 통화라서, 기술 업무 반, 말하는 일 반이에요. 그래서 길게 비는 시간이 거의 없어요. 대신 자투리 시간을 최대한 써요. 출퇴근길엔 짧은 학습 카드를 몇 장 봐요. 영어, 시험 공부, AI 뉴스 조금이요. 예전엔 제대로 공부하려면 두세 시간은 있어야 한다고 생각했는데, 솔직히 직장 다니면서 그건 현실적이지 않잖아요. 그래서 지금은 짧게 해요. 근데 있잖아요, 그게 오히려 더 잘 되더라고요. 제일 크게 배운 건 몰아치기보다 꾸준함이 이긴다는 거예요.","어떻게 보면 그래요. 꼭 더 오래 일하는 건 아닌데, 항상 연락이 닿는 상태잖아요. 그게 진짜 차이 같아요. 일하는 시간이 끝나질 않는 거죠."],
["아, 그건 쉬운 질문이네요. 스쿠버 다이빙이에요. 레스큐 다이버까지 땄으니까 저한테는 그냥 휴가 때 하는 취미 이상이에요. 특히 기억에 남는 건 필리핀 코론 여행이에요. 하루에 세 번씩 들어갔는데, 힘들었지만 기분 좋은 피곤함이었어요. 다이빙이 좋은 건 물속이 완전히 다른 세상이라는 거예요. 휴대폰도 못 보고 일 생각도 못 해요. 나, 내 호흡, 내 버디뿐이죠. 제가 완전히 스위치를 끌 수 있는 거의 유일한 시간이에요. 레스큐 훈련도 계속 남아 있어요. 압박 속에서 침착하라는 걸 배웠는데, 웃기게도 그게 회사에서도 꽤 쓸모 있더라고요.","왜 그렇게들 생각하는지는 이해돼요. 그런데 위험의 대부분은 기본을 건너뛰는 데서 와요. 제대로 훈련받고 자기 한계를 지키면 생각보다 훨씬 안전해요."],
["큰 질문이네요. 솔직히 AI가 엔지니어를 대체할 거라고는 생각 안 해요. 그런데 우리가 시간을 어디에 쓰는지는 확실히 바꿀 거예요. 우리 일의 상당 부분이 반복 작업이거든요. 보고서 업데이트, 숫자 확인, 진행 상황 관리 같은 거요. 바로 거기가 AI가 빛나는 영역이에요. 실제로 저도 AI 도구로 프로젝트 관리용 작은 웹앱을 만들고 있어요. 솔직히 손으로 하는 게 지겨워서요. 시간은 엄청 아껴주지만 결정까지 해주진 않아요. AI가 못 하는 건, 적어도 아직은, 책임지는 거예요. 설계가 선급 승인을 받으러 가면 누군가는 그 숫자를 책임져야 하잖아요. 그래서 간단히 말하면, AI를 쓰는 사람이 안 쓰는 사람을 대체할 거예요.","핵심은 대체가 아니라 재교육이라고 봐요. 도구를 배울 시간을 주고, 판단이 필요한 일 쪽으로 옮겨주는 거죠. 그게 회사에도 좋아요."],
["떠오르는 건 한 기술 협력사와의 논의예요. 그쪽에서 온도 해석을 했는데, 결과가 더 높은 강재 등급 쪽으로 가고 있었고 그게 제작에 실제로 큰 영향을 줬어요. 다시 봐 달라고 했더니 대답이 사실상 '저희는 절차대로 했는데요'였어요. 공정하게 말하면 맞는 말이긴 했죠. 그런데 문제 해결은 안 됐어요. 그래서 누가 맞냐로 다투는 대신 이렇게 말했어요. '규정을 어기라는 게 아니에요. 실제 운전 조건을 한 번만 다시 봐 주시면 정말 감사하겠어요.' 그리고 덧붙였죠. '우리 파트너로 일하는 거잖아요, 그렇죠?' 거기서 배운 건, 사람이 아니라 문제에 집중하면 무례하지 않으면서도 단호할 수 있다는 거예요.","정면으로 다루되 정중하게 하는 게 낫다고 봐요. 피하면 보통 나중에 더 커지거든요. 사실에 집중하면 대부분 사람들은 꽤 합리적이에요."],
["그 주가 어땠느냐에 따라 정말 달라요. 정신없는 주였으면 대부분 쉬면서 잠을 보충해요. 그런데 요즘은 부모님이랑 시간을 더 보내려고 해요. 사실 이번 가을에 부모님 모시고 경주에 짧게 다녀오려고 계획 중이에요. 이맘때 단풍이 그렇게 예쁘다더라고요. 현지 맛집도 몇 군데 찾아 놨어요. 솔직히 부모님이랑 가면 음식이 여행의 반이거든요. 주말에도 공부를 조금 끼워 넣으려고 하는데, 못 해도 자책은 안 해요. 주말은 충전하는 시간이니까요. 안 그러면 다음 주가 그냥 무너져요.","요즘은 사람들이 균형을 훨씬 중요하게 여기는 것 같아요. 예전엔 그냥 쉬는 게 전부였는데, 요즘은 주말을 계획하잖아요. 취미, 짧은 여행, 그런 거요."],
["안녕하세요, 좋은 아침입니다. 제 이름으로 된 예약 건 때문에 전화드렸어요. 내일 밤 체크인 예정인데, 안타깝게도 방금 비행기가 취소됐고 제일 빨리 잡을 수 있는 편이 그다음 날 도착해요. 급하게 연락드리는 거 충분히 알고 있어서, 도와주시면 정말 감사하겠어요. 혹시 예약을 하루 미룰 수 있을까요? 그게 안 되면 첫날 밤만 수수료 없이 취소해 주실 수 있을까요? 나머지 예약은 그대로 유지하고 싶어요. 아니면 수수료가 있다면, 바꾸기 전에 얼마인지 먼저 알려주실 수 있을까요? 그리고 확인차 여쭤보는데, 변경되면 확인 메일 보내주실 수 있을까요? 정말 감사합니다.","아, 괜찮아요, 충분히 이해해요. 그럼 첫날 밤만 취소하고 나머지는 유지해 주시겠어요? 그리고 혹시 수수료를 면제해 주실 방법이 있다면 정말 감사하겠습니다."],
["네. 저는 큰 조선소에서 일해서, 사무실 업무랑 아주 산업적인 환경이 섞여 있어요. 저희 팀은 사무동에 있는데, 바로 밖에는 건조 중인 거대한 배들이랑 크레인이 사방에 있어요. 제일 좋은 건 우리가 화면에서 설계한 게 눈앞에서 실제로 만들어진다는 거예요. 화려한 곳은 아니지만 처음 보면 꽤 압도돼요. 보통 하루는 설계 검토, 해외 고객 통화, 아니면 팀이랑 해석 결과를 같이 보는 거예요. 제일 좋은 건 사람들이에요. 다들 바쁘지만 문제가 생기면 정말 똘똘 뭉쳐요. 아쉬운 점이요? 마감 직전엔 꽤 정신없어요.","대체로 동의해요. 돈도 중요하죠, 오해는 마세요. 그런데 매일 출근하는 게 끔찍하다면, 어떤 월급으로도 그건 메워지지 않아요."],
["아, 오랫동안 버킷리스트에 있던 곳이 하나 있어요. 타히티요. 정확히는 거기서 혹등고래랑 같이 수영해 보고 싶어요. 다이빙을 꽤 해서 물은 편한데, 이건 차원이 다른 경험일 것 같아요. 찾아보니까 고래가 섬 가까이 오는 시즌이 있어서, 가이드랑 같이 실제로 물에 들어갈 수 있대요. 저는 쇼핑보다 자연이 주인공인 곳에 끌리는 것 같아요. 아직 가 보진 못했고, 솔직히 싼 여행이 아니라서 제대로 계획하고 싶어요. 그래도 기회만 되면 절대 안 놓칠 거예요.","좋은 지적이에요. 제한을 두는 게 많이 도움 된다고 봐요. 소규모 그룹이나 동물 주변 엄격한 규칙 같은 거요. 제대로만 하면 관광이 오히려 보호 활동 자금이 될 수도 있어요."],
["저한테는 꽤 자주 있는 일이에요. 최근에 고객한테 구조 디지털 트윈을 발표했는데, 고객이 정말 흥미로워했어요. 좋은 일이었죠. 그런데 탑사이드 인터페이스나 아주 높은 주파수의 실시간 모니터링 같은 걸 요청하기 시작했어요. 그래서 먼저 실제로 무슨 뜻인지 이해하고 싶었어요. '확인차 여쭤보는데, 실시간이라고 하시면 초 단위를 말씀하시는 건가요?' 하고 물었죠. 그다음엔 두 묶음으로 나눴어요. 올해 원래 범위 안에서 해드릴 수 있는 것, 그리고 별도 과제가 필요한 것. 과하게 약속했다가 나중에 실망시키느니 미리 솔직하게 말하는 게 낫다고 봐요. 회의에서 제일 신나는 말은 아니지만, 길게 보면 신뢰가 쌓여요.","제 경험으로는 보통 엔지니어링을 못해서가 아니에요. 범위가 불분명해서죠. 초반에 다 같이 같은 이해를 갖지 않으면 변경이 계속 쌓여요."],
["하나만 고르라면 소통이라고 하겠지만, 큰 단서가 붙어요. 왜냐면요, 해양 프로젝트 구조 설계를 이끌어 보니 해석은 제일 어려운 부분이 거의 아니에요. 까다로운 건 선주, 선급, 시공사의 생각을 맞추는 거예요. 다들 우선순위가 다르니까요. 그렇긴 하지만 이해 못 한 걸 제대로 설명할 수는 없잖아요. 제가 트레이드오프를 명확하게 설명 못 하면 아무도 그 제안을 안 믿어요. 그래서 이렇게 말하고 싶어요. 기술력은 테이블에 앉을 자격을 주고, 소통은 프로젝트를 실제로 앞으로 움직인다고요.","대부분 만들어진다고 봐요. 원래 자신감 있는 사람도 있긴 하죠. 하지만 경청하는 거나 어려운 결정을 내리는 건 경험에서 나와요."],
["음, 어떤 스트레스냐에 따라 정말 달라요. 마감 같은 업무 스트레스라면, 최악은 그냥 전체를 멍하니 쳐다보는 거예요. 그래서 작은 일로 쪼개서 쉬운 것부터 해치워요. 그것만으로도 부담이 확 줄어요. 그런데 번아웃 같은 스트레스면 몸을 아예 그 상황에서 떼어놔야 해요. 저한테 최고의 리셋은 다이빙이에요. 물속에 들어가면 말 그대로 이메일을 볼 방법이 없거든요. 물론 매주 갈 순 없으니, 평소엔 그냥 바람 좀 쐬려고 해요. 단순해 보여도 효과가 있어요.","여러 가지가 섞여 있다고 봐요. 긴 근무 시간, 경쟁, 그리고 항상 온라인 상태라는 거요. 다행인 건 요즘 사람들이 그 얘기를 훨씬 많이 한다는 거예요."],
["저기, 잠깐 시간 괜찮아요? 보고서 쓸 때 그 새 AI 도구 쓰기 시작했다고 들었는데, 안 그래도 물어보고 싶었어요. 우선, 쓴 지 얼마나 됐어요? 주로 뭐에 써요? 초안 쓰는 데만 쓰는 건지, 숫자 확인할 때도 도움이 되는지 궁금해요. 정확도도 궁금해요. 혹시 기술 용어를 틀리는 것 같은 실수를 잡은 적 있어요? 그리고 마지막으로, 배우는 데 시간 들일 가치가 있어요? 회의록에 한번 써 볼까 해서요. 팁 있으면 알려주면 좋겠어요. 급한 건 아니에요.","한꺼번에 다 하진 않는 게 좋을 것 같아요. 작게 시범으로 써 보고, 뭐가 효과 있는지 본 다음에 넓히는 거죠. 그래야 누구한테도 억지로 강요하는 게 아니니까요."],
["좋은 예가 오슬로에서 했던 워크숍이에요. 여러 기관에서 온 사람들이 있었어요. 제 역할은 선체 구조 부분을 차근차근 설명하고 질의응답을 맡는 거였어요. 그런데 어려웠던 건 내용 자체가 아니었어요. 그건 제가 잘 알거든요. 방에 있는 사람들 배경도 우선순위도 다 달랐다는 게 문제였죠. 어떤 분들은 기술 디테일에 깊이 들어가 있었고, 어떤 분들은 큰 그림만 원했어요. 그래서 단순한 흐름으로 정리하려고 했어요. 문제가 뭔지, 선택지가 뭔지, 우리가 뭘 추천하는지요. 질의응답 때 어려운 질문이 오면 '좋은 지적이네요. 질문을 제대로 이해했는지 확인해 볼게요' 같은 말을 했는데, 그게 생각할 시간을 벌어줬어요.","솔직히 청중을 아는 거요. 같은 내용도 방에 누가 있느냐에 따라 완전히 다르게 받아들여져요. 그래서 저는 늘 '이분들이 뭘 가지고 돌아가야 하지?' 하고 스스로 물어요."],
["한 예로 협력사가 용접 평가를 보내온 적이 있어요. 2D 쉘 모델을 썼는데, 서류상으로는 숫자가 괜찮아 보였어요. 그런데 저는 최종 숫자에서 멈추지 않는 법을 배웠어요. 결과가 어떻게 나왔는지 설명 못 하면 고객이나 선급 앞에서 방어할 수가 없거든요. 그래서 정중하게 기본적인 질문 몇 개를 했어요. 요소 타입은 뭘 썼는지, 경계조건이랑 하중 조건은 어떻게 했는지, 응력은 정확히 어디서 읽었는지요. 모델 자체를 공유해 줄 수 있는지도 물었고요. 그쪽이 틀렸다고 가정한 게 아니었어요. 해석을 추적 가능하게 만들려는 거였죠. 저한테 품질은 그냥 통과하는 숫자가 아니에요. 그 결과에 어떻게 도달했는지까지 책임질 수 있는 거예요.","가끔은 그래요. 숫자는 객관적으로 보이지만, 그 뒤에 있는 가정만큼만 믿을 수 있어요. 그래서 데이터는 믿되 항상 어디서 나왔는지 물어봐야 한다고 봐요."],
["어느 단계에 있느냐에 따라 다르다고 보는데, 요즘 저는 어느 정도 틀을 잡고 혼자 배우는 쪽으로 기울어요. 제 생각은 이래요. 정규 교육은 기본기에는 좋아요. 틀을 잡아주니까요. 그런데 기본을 갖추고 나면, 제일 빨리 배우는 건 실제로 뭔가를 만들어 보는 거예요. AI 도구만 봐도 그래요. 어떤 강의도 그 변화 속도를 못 따라가요. 그래서 저는 해 보면서 배우고 있어요. 업무 일부를 자동화하는 작은 앱들을 만들면서요. 처음엔 가파르고 자주 막히는데, 막힌 데서 빠져나올 때마다 확실히 몸에 남아요. 단점 하나는 피드백 없이 나쁜 습관이 들 수 있다는 거예요. 그래서 이상적으로는 둘 다 하는 거죠.","둘 다 필요한데 균형이 좀 안 맞는 것 같아요. 학생들이 이론은 많이 배우는데 적용하는 건 충분히 안 배워요. 실습 프로젝트가 늘면 큰 차이가 날 거예요."],
["제일 큰 변화는 거리가 예전만큼 중요하지 않다는 거라고 봐요. 10년 전엔 해외 고객이랑 설계 문제가 생기면 보통 긴 이메일 왕복이나 출장이었어요. 요즘은 그냥 바로 화상회의 잡고, 화면에 모델 띄워서 한 시간이면 정리해요. 좋은 점은 결정이 훨씬 빨라졌다는 거고요. 반면에 일하는 시간이 진짜로 끝나질 않아요. 다른 시간대에 누군가는 항상 온라인이니까요. 그리고 이제 AI까지 나왔으니, 다음 큰 변화는 반복 업무가 얼마나 사라지느냐일 것 같아요. 과제는 사람들이 여전히 그 안에서 무슨 일이 일어나는지 이해하게 하는 거겠죠.","어려운 질문이네요. 더 유연해진 건 확실해요. 더 행복해졌냐고요? 잘 모르겠어요. 사람들이 선을 그을 수 있느냐에 정말 달린 것 같아요."],
["솔직히 업계엔 힘들어도 필요하다고 생각해요. 해운이 전 세계 물건 대부분을 실어 나르니까 배출량이 정말 쌓여요. 규제가 없으면 바꿀 동기가 별로 없어요. 친환경 기술은 초기 비용이 더 드니까요. 좋은 점은 규제가 실제 혁신을 끌어내고 있다는 거예요. LNG 추진선이 꽤 흔해졌고, 암모니아나 메탄올도 연구 중이에요. 그렇긴 하지만 일정이 정말 공격적일 수 있어요. 선주들은 길게 봐서 어떤 연료가 이길지 모르는 채로 엄청난 투자 결정을 해야 하거든요. 그래서 방향은 맞지만, 업계가 실제로 대비할 수 있게 규제가 명확하고 예측 가능해야 한다고 봐요.","현실적으로는 셋 다요. 정부는 인센티브로 돕고, 기업은 투자해야 하고, 소비자는 아마 가격이 조금 오르는 걸 겪게 될 거예요. 딱 잘라 말할 문제는 아니에요."],
["저를 정말 한계까지 몰아붙인 건 레스큐 다이버 훈련이었어요. 그전에는 다이빙이 주로 경치를 즐기는 거였어요. 그런데 레스큐 훈련은 완전히 다른 얘기였어요. 의식 없는 다이버를 수면으로 끌어올리거나 패닉에 빠진 다이버를 다루는 걸 연습하는데, 심장이 쿵쾅거리는 와중에 머리는 맑게 생각해야 해요. 어려웠던 건 몸이 힘든 것만이 아니었어요. 본능은 서두르라고 하는데 천천히 하는 법을 배우는 거였죠. 제일 큰 교훈은 침착함이 성격이 아니라 기술이라는 거예요. 진짜로 훈련할 수 있어요. 솔직히 긴장되는 회의에서도 그게 꽤 쓸모 있었어요.","주변에 어떤 지지가 있느냐에 달린 것 같아요. 좋은 사람들이 곁에 있으면 힘든 경험이 사람을 더 강하게 만들어요. 그게 없으면 분명히 발목을 잡을 수도 있고요."],
["아, 제일 기대되는 건 해양 부유식 설비의 구조 디지털 트윈이에요. 제가 PM을 맡고 있어요. 기본 아이디어는 꽤 단순해요. 지금은 검사를 대부분 정해진 일정대로 해요. 구조물이 필요하든 아니든요. 저희는 운동 데이터, 구조 응력, 피로, 검사 계획을 하나로 잇고 있어요. 다시 말해 운영 데이터를 의사결정으로 바꾸고 싶은 거예요. 어디를, 언제 검사할지요. 아직 개발 중이라 과장하고 싶진 않아요. 그래도 정말 설레는 건, 사후 대응에서 선제 대응으로 바뀔 수 있다는 점이에요.","가장 큰 위험은 맹목적으로 믿는 거예요. 입력 데이터가 나쁘면 결정도 나빠져요. 그래서 여전히 엔지니어가 결과를 확인해야 해요."],
["저는 꽤 조용한 주거 지역에 살아요. 매일 아침 커피숍에서 같은 얼굴들을 보는 그런 동네예요. 제일 좋은 건 필요한 게 다 걸어갈 수 있는 거리에 있다는 거예요. 마트, 괜찮은 식당 몇 곳, 작은 공원까지요. 엄청 재밌는 동네는 아니지만, 긴 하루를 마치고 나면 딱 그게 제가 원하는 거예요. 유일하게 아쉬운 건 출퇴근 시간 교통이에요. 동네 빠져나가는 데만 한참 걸려요. 하나 바꿀 수 있다면 산책로를 더 만들고 싶어요. 요즘 운동을 더 하려고 하거든요.","첫째는 안전, 그다음이 공동체라고 봐요. 물론 좋은 학교도 중요하죠. 그래도 이웃을 아는 게 정말 큰 차이를 만들어요."],
["뻔한 답은 스마트폰이지만, 솔직히 저한테 더 큰 변화는 AI 도구예요. 요즘은 거의 매일 써요. 회사에서는 긴 문서 요약이나 이메일 초안에 쓰고, AI 도움으로 작은 앱도 몇 개 만들었어요. 시간을 엄청 아껴줬어요. 출퇴근길엔 폰으로 공부해요. 예전엔 긴 시간이 필요하다고 생각했는데, 알고 보니 자투리 시간이 정말 쌓이더라고요. 단점은 스위치를 끄기 어렵다는 거예요. 조심 안 하면 밤늦게 업무를 보고 있어요. 그래서 기술 덕분에 더 생산적이 됐지만, 한계는 스스로 정해야 한다고 생각해요.","적어도 어린아이들한테는 그래야 한다는 쪽으로 기울어요. 그런데 규칙만으로는 안 돼요. 부모도 좋은 본보기가 돼야 하는데, 그게 말처럼 쉽진 않죠."],
["안녕하세요, 지연 소식 알려주셔서 감사해요. 미리 알려주셔서 정말 고맙습니다. 그런데 솔직히 말씀드리면, 2주는 저희 일정에 큰 문제예요. 그래서 무슨 일인지 이해하고 싶어요. 원인이 뭔지 차근차근 설명해 주시겠어요? 자재 문제인가요, 생산 문제인가요? 여쭤보는 이유는, 그에 따라 저희가 할 수 있는 게 달라지거든요. 앞당기려면 뭐가 필요할까요? 예를 들어 납품을 나눠서 제일 중요한 부품부터 먼저 보내주실 수 있을까요? 아니면 추가 근무조를 넣어서 따라잡는 건요? 우리 한 팀이잖아요. 내일까지 만회 계획을 보내주시면 정말 감사하겠습니다.","그것만으로도 정말 도움이 돼요, 감사합니다. 다만 그 절반에 중요한 품목이 꼭 들어가게 해 주세요. 목록을 오늘 보내주실 수 있을까요?"],
["떠오르는 건 해양 프로젝트에서 두 가지 구조 설계안 중 하나를 골라야 했던 일이에요. 서류상으로는 A안이 더 나아 보였어요. 더 가볍고 해석 결과도 깔끔했죠. 그런데 문제는, 제작이 정말 어려웠을 거고 나중에 검사원이 들어가기도 힘들었을 거예요. B안은 조금 더 무거웠지만 현실에서는 훨씬 실용적이었어요. 쉬운 결정은 아니었어요. 숫자만 보는 사람들도 있었으니까요. 그래서 트레이드오프를 하나씩 짚어 설명했어요. 무게 대 제작, 검사, 유지보수요. 결국 실용적인 안으로 갔어요. 돌아보면, 기술적으로 가장 좋은 답이 프로젝트에 가장 좋은 답은 아니라는 걸 배웠어요.","아마 제작팀을 더 일찍 불렀을 것 같아요. 첫날부터 그분들이 같이 있었으면 논의를 몇 번은 줄일 수 있었을 거예요."],
["아, 재밌는 질문이네요. 하루 CEO가 된다면 우리 엔지니어들이 시간을 어디에 쓰는지에 집중하겠어요. 왜냐면요, 정말 실력 있는 사람들이 보고서 업데이트나 손으로 하는 진행 관리 같은 반복 업무에 몇 시간씩 써요. 제가 정할 수 있다면 그걸 자동화하는 작은 팀을 만들고, 뭘 자동화할지는 엔지니어들이 제안하게 하겠어요. 어디가 가려운지는 그 사람들이 제일 잘 아니까요. 그리고 하루짜리 교육 말고, 이런 도구를 배울 진짜 시간을 주겠어요. 물론 하루로는 많이 못 바꾸죠. 그래도 시작만 해 놓으면 길게 봐서 정말 효과가 있을 거예요.","듣는 능력이라고 봐요. CEO는 실제 현장과 멀리 떨어져 있어서 진실을 말해 줄 사람이 필요하고, 본인도 그걸 듣고 싶어 해야 해요."],
["양날의 검이라고 할 수 있죠. 좋은 점은 출퇴근 시간을 많이 아끼고, 해석 결과 확인 같은 집중 업무를 할 때 더 집중이 잘 된다는 거예요. 게다가 이제 화상회의가 너무 당연해져서 거리가 별로 중요하지 않아요. 반면에 소소한 대화를 잃어요. 제 분야에선 누군가 자리에 걸어가서 도면을 같이 보면 풀리는 문제가 많거든요. 화면으로는 그게 말처럼 쉽지 않아요. 그래서 개인적으로는 하이브리드가 제일 합리적이라고 봐요. 집중할 땐 재택, 협업할 땐 출근이요.","어떤 직업엔 분명히 그럴 거예요. 하지만 저처럼 물리적인 걸 다루는 일에서는 사무실이 계속 남을 거라고 봐요."],
["사소한 건데 웃겼던 일이에요. 친구가 제가 밥 먹을 때 폰을 너무 많이 본다고 투덜댔어요. 뭐, 그건 인정이죠. 그런데 말 그대로 5분 뒤에 그 친구가 자기 폰을 스크롤하고 있는 거예요. 그래서 '에이, 그거 좀 내로남불 아니야?' 했더니 둘 다 빵 터졌어요. 이런 순간이 좋은 건, 말다툼으로 번지지 않고도 상대한테 한마디 할 수 있다는 거예요. 약간의 유머가 큰 힘이 되죠.","당연하죠, 누군가를 깎아내리는 게 아니라면요. 가벼운 한마디가 어려운 회의의 긴장을 풀어줘요. 우리가 같은 팀이라는 걸 떠올리게 해 주죠."],
["정답이 하나 있다고는 생각 안 해요. 결국 뭘 쌓고 싶으냐의 문제예요. 한 회사에 오래 있으면 깊이 들어갈 수 있어요. 일이 실제로 어떻게 돌아가는지 알고, 사람들이 믿어주고, 더 큰 책임을 맡게 되죠. 반면에 이직하면 다양한 일하는 방식을 접하고, 특히 커리어 초반엔 성장을 앞당길 수 있어요. 위험은 자기 결정의 결과를 볼 만큼 오래 머물지 못한다는 거예요. 그래서 얼마나 오래 있느냐가 아니라, 아직 배우고 있느냐가 중요하다고 봐요.","아주 다르게 본다고 생각해요. 부모님 세대에겐 평생직장이 목표였죠. 젊은 세대는 성장과 유연성을 더 중시해요. 솔직히 저도 이해가 돼요."],
["AI는 중요한 결정을 도와야 하지만 혼자 결정해선 안 된다고 생각해요. 가장 큰 이유는 책임이에요. 엔지니어링에서는 설계가 승인되면 사람이 그걸 책임져야 해요. 뭔가 잘못됐을 때 'AI가 그렇게 말했어요'는 통하는 답이 아니잖아요. 그렇긴 하지만 AI는 엄청난 양의 데이터를 다루는 데 정말 뛰어나고, 사람이 놓치는 패턴을 잡아낼 수 있어요. 예를 들어 제 디지털 트윈 프로젝트는 데이터로 구조물을 어디를, 언제 검사할지 정하는 게 목표예요. 그래도 최종 판단은 맥락을 이해하는 엔지니어가 내려야 해요. 그래서 이렇게 말하고 싶어요. 힘든 일은 AI한테 맡기되, 결정 과정에는 꼭 사람을 남겨두자고요.","그게 바로 핵심 질문이죠. 저는 사용자가 아니라 그걸 도입한 회사라고 봐요. 서비스에 넣었으면 결과도 책임져야죠."],
["5년 뒤엔 전통적인 구조 엔지니어링과 디지털 기술을 잇는 사람이 되고 싶어요. 지금 디지털 트윈 프로젝트를 하고 있는데, 실제 운영 데이터를 쓰는 게 얼마나 가치 있는지 벌써 보여요. 그걸 더 키워서 시범 사업이 아니라 실제 서비스로 만드는 데 기여하고 싶어요. 개인적으로는 기술사 시험에 합격하고, 국제 회의를 망설임 없이 이끌 만큼 영어가 편해졌으면 해요. 그걸 해내면 정말 좋은 위치에 있을 것 같아요. 그리고 바라건대, 다이빙 여행 갈 시간도 좀 남아 있으면 좋겠네요.","질문을 많이 하세요, 기초적인 것까지도요. 아무도 다 알기를 기대하지 않아요. 하지만 왜 그 일을 하는지는 이해하고 있기를 기대하죠."]
];

async function getDL(){if(DL)return DL;try{if(window.claude&&window.claude.use){DL=await window.claude.use("downloads")}}catch(e){}return DL}
async function recStart(){
  REC.err=null;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){REC.err="nomic";render();return}
  REC.busy=true;render();
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    const mime=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus"].find(m=>{try{return MediaRecorder.isTypeSupported(m)}catch(e){return false}})||"";
    const mr=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);REC.chunks=[];
    mr.ondataavailable=e=>{if(e.data&&e.data.size)REC.chunks.push(e.data)};
    mr.onstop=()=>{
      const type=mr.mimeType||mime||"audio/webm";const blob=new Blob(REC.chunks,{type});const secs=(Date.now()-REC.t0)/1000;
      stream.getTracks().forEach(t=>t.stop());clearInterval(REC.iv);cancelAnimationFrame(REC.raf);try{REC.ac&&REC.ac.close()}catch(e){}
      const ext=/mp4/.test(type)?"mp4":/ogg/.test(type)?"ogg":"webm";
      const name=`SAIL_Day${pad(REC.day)}${REC.which==="follow"?"_followup":""}_${today()}_take${REC.takes.length+1}`;
      const take={blob,url:URL.createObjectURL(blob),secs,ext,name,q:recQuestion(),wav:null};
      REC.takes.unshift(take);REC.mr=null;REC.stream=null;render();
      toWav(blob).then(w=>{take.wav=w}).catch(()=>{});
    };
    mr.start(500);REC.mr=mr;REC.stream=stream;REC.t0=Date.now();REC.busy=false;render();
    try{const AC=window.AudioContext||window.webkitAudioContext;REC.ac=new AC();const src=REC.ac.createMediaStreamSource(stream);REC.an=REC.ac.createAnalyser();REC.an.fftSize=64;src.connect(REC.an);
      const buf=new Uint8Array(REC.an.frequencyBinCount);const loop=()=>{const m=$("#meter");if(m&&REC.an){REC.an.getByteFrequencyData(buf);[...m.children].forEach((b,i)=>{const v=buf[(i+1)%buf.length]/255;b.style.height=(8+v*48)+"px"})}REC.raf=requestAnimationFrame(loop)};loop()}catch(e){}
    const [z1,z2]=zone();
    REC.iv=setInterval(()=>{const el=$("#rec-clock");if(!el)return;const s=(Date.now()-REC.t0)/1000;el.textContent=fmtClock(s);el.classList.toggle("z-good",s>=z1&&s<=z2);el.classList.toggle("z-over",s>z2)},250);
  }catch(e){REC.busy=false;REC.err="nomic";render()}
}
function recStop(){if(REC.mr&&REC.mr.state!=="inactive")REC.mr.stop()}
async function toWav(blob){
  const AC=window.AudioContext||window.webkitAudioContext;const ac=new AC();const buf=await ac.decodeAudioData(await blob.arrayBuffer());try{ac.close()}catch(e){}
  const sr=16000,len=Math.max(1,Math.ceil(buf.duration*sr));const off=new OfflineAudioContext(1,len,sr);const src=off.createBufferSource();src.buffer=buf;src.connect(off.destination);src.start();
  const data=(await off.startRendering()).getChannelData(0);const dv=new DataView(new ArrayBuffer(44+data.length*2));
  const w=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i))};
  w(0,"RIFF");dv.setUint32(4,36+data.length*2,true);w(8,"WAVE");w(12,"fmt ");dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,sr,true);dv.setUint32(28,sr*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);w(36,"data");dv.setUint32(40,data.length*2,true);
  for(let i=0;i<data.length;i++){const s=Math.max(-1,Math.min(1,data[i]));dv.setInt16(44+i*2,s<0?s*0x8000:s*0x7fff,true)}
  return new Blob([dv],{type:"audio/wav"});
}
function localDownload(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
async function saveTake(i){
  const t=REC.takes[i];const dl=await getDL();
  if(!dl){localDownload(t.blob,t.name+"."+t.ext);return}
  try{await dl.save({filename:t.name+"."+(t.ext==="ogg"?"webm":t.ext),data:t.blob});toast("저장했어요")}
  catch(e){toast(e&&e.code==="declined"?"저장을 취소했어요":"이 화면에서는 저장할 수 없어요")}
}

   case "install":doInstall();break;
   case "install-hide":INSTALL_HIDE=true;LS.set("installHide",true);render();break;
   case "take-wav":{const t=REC.takes[+b.dataset.i];if(t.wav){localDownload(t.wav,t.name+".wav");break}b.disabled=true;b.textContent="변환 중…";toWav(t.blob).then(w=>{localDownload(w,t.name+".wav");b.disabled=false;b.textContent="WAV로 저장"}).catch(()=>{toast("WAV 변환에 실패했어요. 원본으로 저장하세요.");b.disabled=false;b.textContent="WAV로 저장"});break}
   case "take-prompt":{const t=REC.takes[+b.dataset.i];copy(gptPrompt(t.q,t.secs));break}
   case "prompt-now":copy(gptPrompt(recQuestion(),0));break;
   case "copy-name":copy(`SAIL_Day${pad(REC.day)}_${today()}`);break;
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="rec-day"&&!REC.mr){REC.day=+t.value;render()}
  if(t.id==="exam"&&t.value){S.exam=t.value;save();render()}
});
window.addEventListener("hashchange",()=>{if(REC.mr&&curTab()!=="record")recStop();render()});
render();initCloud();
if("serviceWorker" in navigator&&!IN_CLAUDE&&/^https?:$/.test(location.protocol)){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
